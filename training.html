<!DOCTYPE html>
<html>

<head>

<title>Basketball Shot Creator Lab</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
text-align:center;
}

header{
padding:25px;
font-size:32px;
background:#1e293b;
}

.moves{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
margin-top:40px;
}

.move{
background:#1e293b;
padding:25px;
border-radius:10px;
width:220px;
cursor:pointer;
transition:0.3s;
}

.move:hover{
background:#334155;
transform:scale(1.05);
}

#trainingBox{
margin-top:40px;
background:#1e293b;
padding:30px;
width:60%;
margin-left:auto;
margin-right:auto;
border-radius:12px;
}

#title{
font-size:24px;
margin-bottom:15px;
}

button{
margin-top:20px;
padding:10px 18px;
border:none;
background:#f97316;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#ea580c;
}

.ball{
font-size:60px;
margin-top:20px;
transition:0.8s;
}

</style>

</head>

<body>

<header>
🏀 Shot Creator Training Lab
</header>

<div class="moves">

<div class="move" onclick="showMove('kyrie')">
Kyrie Jumper
</div>

<div class="move" onclick="showMove('shai')">
SGA Midrange
</div>

<div class="move" onclick="showMove('fade')">
Fadeaway
</div>

</div>

<div id="trainingBox">

<div id="title">Select a move</div>

<div id="description">
Click one of the moves above to see the training breakdown.
</div>

<button onclick="practice()">Practice Shot</button>

<div id="ball" class="ball">🏀</div>

</div>

<script>

function showMove(move){

let title=document.getElementById("title")
let desc=document.getElementById("description")

if(move==="kyrie"){

title.innerText="Kyrie Pull-Up Jumper"

desc.innerText="Dribble low, plant your inside foot, rise quickly and release at the top of your jump."

}

if(move==="shai"){

title.innerText="SGA Midrange Stop"

desc.innerText="Use a slow dribble, stop suddenly, and shoot before the defender recovers."

}

if(move==="fade"){

title.innerText="Fadeaway"

desc.innerText="Create space by leaning back while jumping and release at your highest point."

}

}

function practice(){

let ball=document.getElementById("ball")

ball.style.transform="translateY(-150px)"

setTimeout(()=>{
ball.style.transform="translateY(0)"
},800)

}

</script>

</body>

</html>
